<h1>Markdown Cheatsheet</h1>
<table>
<thead>
<tr>
<th>Syntax</th>
<th>Result</th>
</tr>
</thead>
<tbody><tr>
<td><code>**bold**</code></td>
<td><strong>bold</strong></td>
</tr>
<tr>
<td><code>*italic*</code></td>
<td><em>italic</em></td>
</tr>
<tr>
<td><code>[link](url)</code></td>
<td>a link</td>
</tr>
<tr>
<td><code>&gt; quote</code></td>
<td>a blockquote</td>
</tr>
</tbody></table>
