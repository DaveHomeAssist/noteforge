name: Deploy NoteForge

# Build + test on pull requests and every push to main. Publish the static Vite
# build to GitHub Pages (davehomeassist.github.io/noteforge/) only after a green
# main/manual verification run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull-request runs for the same ref supersede each other. A newer push to main
# queues behind the in-flight main run instead of cancelling it, so a
# deployment is never abandoned half-way and every main commit is verified.
concurrency:
  group: noteforge-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-matrix:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # Actions pinned by SHA per GitHub's security-hardening guide.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check (biome ci, zero errors, no unformatted files)
        run: npm run check

      - name: Typecheck (tsc --checkJs per-file ratchet)
        run: npm run typecheck

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Unit tests (node --test with JUnit report and case floor)
        run: npm test

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-node${{ matrix.node }}
          path: test-results/junit.xml
          if-no-files-found: warn

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Playwright Test: the in-page feature suite, the eight end-to-end smokes
      # (dev server and the production build offline), and the axe ratchet
      # (test/e2e/a11y-baseline.json). Retries once in CI; a retried pass is
      # reported as flaky. Traces are kept for failures.
      - name: End-to-end and accessibility (Playwright)
        run: npx playwright test --project=features --project=a11y

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-node${{ matrix.node }}
          path: test-results/
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Initial shell budget (docs/implementation/performance_budgets.md)
        run: npm run test:budget

      - name: Upload Pages artifact
        if: matrix.node == 22 && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Screenshot baselines (test/e2e/visual.spec.mjs) are compared inside the
  # Playwright image whose version matches the lockfile, so fonts and
  # rasterization are identical to the image that rendered the baselines.
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read @playwright/test from package-lock.json
        id: lock
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  visual:
    name: visual (playwright container)
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    env:
      NOTEFORGE_VISUAL: "1"
      # The container's checkout may lack a usable git; the build stamp takes the SHA from here.
      NOTEFORGE_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # A missing baseline is written (and the test still fails), so a new surface
      # arrives as an artifact to review and commit rather than a silent pass.
      - name: Compare screenshot baselines
        run: npx playwright test --project=visual --update-snapshots=missing

      - name: Upload screenshots, diffs, and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-results
          path: |
            test/e2e/__screenshots__/
            test-results/
          retention-days: 7

  # One job named exactly `verify`. System by Dave's noteforge-sync.yml releases
  # only when a job with this name concluded success, and branch protection can
  # require it; a matrix job cannot carry a fixed name, so this aggregates the
  # legs and the visual job (it is skipped, hence not green, when any fails).
  verify:
    needs: [verify-matrix, visual]
    runs-on: ubuntu-latest
    steps:
      - name: All verify legs succeeded
        run: echo "verify (node 22), verify (node 24), and visual are green for $GITHUB_SHA"

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # Ask DaveHomeAssist/system-by-dave to synchronize the canonical
      # systembydave.com/noteforge/ copy from this exact commit. Its
      # .github/workflows/noteforge-sync.yml builds the commit under Node 22,
      # runs sync:noteforge + verify:noteforge, commits `noteforge: sync to <sha>`
      # to its main and deploys. Needs the repository secret
      # SYSTEM_BY_DAVE_DISPATCH_TOKEN: a fine-grained personal access token owned
      # by DaveHomeAssist, repository access limited to system-by-dave, permission
      # Contents: Read and write (the only permission repository_dispatch needs).
      # Without the secret this step warns instead of failing the deploy, and the
      # nightly noteforge-drift.yml in system-by-dave reports the gap.
      - name: Notify system-by-dave of the release
        env:
          DISPATCH_TOKEN: ${{ secrets.SYSTEM_BY_DAVE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::SYSTEM_BY_DAVE_DISPATCH_TOKEN is not set; systembydave.com/noteforge/ was not asked to sync to $GITHUB_SHA"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/DaveHomeAssist/system-by-dave/dispatches \
            -d "{\"event_type\":\"noteforge-release\",\"client_payload\":{\"sha\":\"$GITHUB_SHA\",\"run_id\":\"$GITHUB_RUN_ID\"}}"
          echo "Dispatched noteforge-release for $GITHUB_SHA to DaveHomeAssist/system-by-dave"
