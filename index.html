<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <!-- Pre-paint theme: apply the mirrored preference (written by src/ui/theme.js) before CSS/JS load so dark users never see a light flash. Kept single-line and free of double quotes; vite.config.js hashes it into the production CSP. Dark colour = --bg-elev in src/styles.css. -->
  <script>try{var t=localStorage.getItem('noteforge:theme');if(t==='system')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';if(t==='dark'){document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content='#1e2127'}}catch(e){}</script>
  <title>NoteForge</title>
<meta name="description" content="NoteForge is a local-first notes app with Markdown, wikilinks, backlinks, tags, graph view, templates, offline use, and export.">
<link rel="canonical" href="https://systembydave.com/noteforge/">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="NoteForge">
<meta property="og:title" content="NoteForge">
<meta property="og:description" content="NoteForge is a local-first notes app with Markdown, wikilinks, backlinks, tags, graph view, templates, offline use, and export.">
<meta property="og:url" content="https://systembydave.com/noteforge/">
<meta property="og:image" content="https://systembydave.com/noteforge/og-image.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="NoteForge">
<meta name="twitter:description" content="NoteForge is a local-first notes app with Markdown, wikilinks, backlinks, tags, graph view, templates, offline use, and export.">
<meta name="twitter:image" content="https://systembydave.com/noteforge/og-image.svg">
  <link rel="icon" href="/icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <a class="skip-link" href="#editor">Skip to editor</a>
  <!-- Mobile-only top bar with the sidebar toggle -->
  <div class="mobile-bar">
    <button id="sidebar-toggle" class="btn btn--ghost" aria-label="Open notes sidebar" aria-expanded="false" aria-controls="app"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-menu"></use></svg></button>
    <div class="nav-controls nav-controls--mobile" aria-label="Note history">
      <button id="mobile-nav-back" class="btn btn--ghost" aria-label="Back" disabled><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-arrow-left"></use></svg></button>
      <button id="mobile-nav-forward" class="btn btn--ghost" aria-label="Forward" disabled><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-arrow-right"></use></svg></button>
    </div>
    <span class="mobile-bar__title"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-notebook-pen"></use></svg> NoteForge</span>
    <button id="mobile-theme-btn" class="btn btn--ghost mobile-bar__theme" aria-label="Toggle theme"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-moon"></use></svg></button>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

  <div class="app" id="app">
    <!-- Sidebar: search, actions, note list, tags -->
    <aside class="sidebar">
      <header class="sidebar__header">
        <h1 class="brand"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-notebook-pen"></use></svg> NoteForge</h1>
        <div class="sidebar__actions">
          <div class="nav-controls" aria-label="Note history">
            <button id="nav-back" class="btn btn--ghost" aria-label="Back" title="Alt+Left" disabled><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-arrow-left"></use></svg></button>
            <button id="nav-forward" class="btn btn--ghost" aria-label="Forward" title="Alt+Right" disabled><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-arrow-right"></use></svg></button>
          </div>
          <button id="new-note-btn" class="btn btn--primary" title="New note (Ctrl+N)"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-plus"></use></svg> New</button>
          <button id="capture-btn" class="btn btn--ghost" aria-label="Open Quick Capture"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-inbox"></use></svg></button>
          <button id="theme-btn" class="btn btn--ghost" aria-label="Toggle theme"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-moon"></use></svg></button>
          <button id="graph-btn" class="btn btn--ghost" title="Toggle graph view" aria-label="Toggle graph view"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-waypoints"></use></svg></button>
          <div class="menu">
            <button id="menu-btn" class="btn btn--ghost" title="More" aria-label="More actions" aria-controls="menu-dropdown" aria-expanded="false"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-ellipsis"></use></svg></button>
            <div class="menu__dropdown" id="menu-dropdown" hidden>
              <button id="palette-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-command"></use></svg> Command palette <span class="menu__hint">Ctrl/⌘ P</span></button>
              <button id="template-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-layout-template"></use></svg> New from template…</button>
              <button id="today-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-calendar-days"></use></svg> Open Today’s Note</button>
              <button id="tasks-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-square-check-big"></use></svg> Tasks</button>
              <button id="calendar-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-calendar"></use></svg> Calendar</button>
              <button id="trash-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-trash-2"></use></svg> Trash <span id="trash-badge" class="menu__badge" hidden></span></button>
              <button id="settings-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-settings"></use></svg> Settings</button>
              <button id="history-btn" class="menu__item" disabled><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-history"></use></svg> Revision history</button>
              <button id="backup-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-life-buoy"></use></svg> Backup center</button>
              <button id="clipper-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-scissors"></use></svg> Web clipper setup</button>
              <button id="reconcile-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-folder-sync"></use></svg> Reconcile Markdown folder</button>
              <button id="find-replace-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-text-search"></use></svg> Find and replace <span class="menu__hint">Ctrl/⌘ F</span></button>
              <button id="archive-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-archive"></use></svg> Archive</button>
              <button id="link-report-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-link"></use></svg> Link integrity report</button>
              <button id="export-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-download"></use></svg> Export JSON</button>
              <button id="import-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-upload"></use></svg> Import JSON</button>
              <button id="seed-btn" class="menu__item"><svg class="icon" aria-hidden="true" focusable="false"><use href="%BASE_URL%icons.svg#i-sparkles"></use></svg> Load sample notes</button>
            </div>
          </div>
          <input type="file" id="import-file" accept="application/json" hidden />
        </div>
      </header>

      <div class="search">
        <input type="search" id="search-input" class="search__input"
               placeholder="Search…  (Ctrl+K)  ·  tag: in:title has:banner" autocomplete="off" />
      </div>

      <div class="list-controls">
        <label class="sort-field">Sort
          <select id="sort-select" class="sort-select" title="Sort notes">
            <option value="updated">Updated</option>
            <option value="created">Created</option>
            <option value="title">Title A–Z</option>
          </select>
        </label>
      </div>

      <div id="tag-filter" class="tag-filter"></div>

      <div id="note-list" class="note-list"></div>

      <footer class="sidebar__footer">
        <span id="note-count" class="muted"></span>
      </footer>
    </aside>

    <!-- Main content: editor or graph -->
    <main class="main">
      <section id="editor" class="editor" tabindex="-1"></section>
      <section id="graph" class="graph" hidden></section>
    </main>
  </div>

  <span id="app-status" class="sr-only" role="status" aria-live="polite"></span>

  <script type="module" src="/src/app/main.js"></script>
</body>
</html>
